[project]
name = "lazy-citation"
version = "0.1.0"
description = "Find likely source URLs for sentences in a text file."
requires-python = ">=3.12"
dependencies = [
  "ddgs>=9.16.0",
  "jaro-winkler>=2.0.3",
]

[project.optional-dependencies]
dev = [
  "pip-audit>=2.10.1",
  "pytest>=9.1.1",
  "ruff>=0.16.9",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
